# This vhost is separate from Joyno HR, Casatoon, and the default server.
server {
    listen 80;
    listen [::]:80;
    server_name joynoadmin.tech www.joynoadmin.tech;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/joynoacctg/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://joynoadmin.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.joynoadmin.tech;
    ssl_certificate /etc/letsencrypt/live/joynoadmin.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joynoadmin.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://joynoadmin.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name joynoadmin.tech;
    ssl_certificate /etc/letsencrypt/live/joynoadmin.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joynoadmin.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/joynoacctg/current;
    index index.html;
    # Binary private uploads permit 10 MB. The API still limits ordinary JSON to 1 MB.
    client_max_body_size 11m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control no-store always;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}

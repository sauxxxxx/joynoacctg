# Temporary HTTP-only certificate challenge host. No app or API over plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name joynoadmin.tech www.joynoadmin.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/joynoacctg/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
